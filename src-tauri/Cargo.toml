[package]
name = "grok-build-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
agent-client-protocol = { workspace = true }
xai-grok-shell = { workspace = true }
xai-acp-lib = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-config-types = { workspace = true }
xai-grok-models = { workspace = true }
xai-grok-auth = { workspace = true }
xai-grok-login = { workspace = true }
xai-grok-pager = { workspace = true }
xai-dirs = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
dunce = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
