name: Electron Release Build

# ISS-071: tag-level packaging pipeline for the Electron shell.
# PR/push gates (test + typecheck + build) live in ci.yml — this workflow only
# produces distributables. It uploads artifacts and NEVER creates a Release
# (publishing is decided with signing in ISS-076).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            arch: arm64
            label: macOS ARM
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            arch: x64
            label: macOS Intel
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            arch: x64
            label: Windows x64
          - platform: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            arch: x64
            label: Linux x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # The agent's proto build script needs a real protoc — the repo's
      # bin/protoc is a dotslash wrapper that only works on dev machines.
      # Export PROTOC explicitly so build scripts resolve it before bin/protoc
      # (on Windows the dotslash file isn't a valid Win32 executable).
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export PROTOC for build scripts
        shell: bash
        run: |
          P="$(command -v protoc)"
          # git-bash reports /c/... paths; Win32 CreateProcess needs C:\...
          if command -v cygpath >/dev/null 2>&1; then P="$(cygpath -w "$P")"; fi
          echo "PROTOC=$P" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins 1.94.0 with a fixed target list that lacks
      # some cross-compile targets (e.g. x86_64-apple-darwin) — make sure the
      # active pinned toolchain has this leg's target.
      - name: Ensure cross-compile target
        run: rustup target add ${{ matrix.rust-target }}

      # Keyed per (job, target) by default — matrix legs never share a cache.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.rust-target }}

      # Fail-fast chain: every step must pass before the next runs. A red
      # build/test/pack-gate step fails the job — no skip-to-green.
      - name: Preflight — toolchain contract (node, lockfile, protoc, rust)
        # R6-02 (#280): reject unsupported runtimes before expensive builds.
        shell: bash
        run: node scripts/check-toolchain.mjs --require protoc,rust

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Typecheck + frontend build
        run: npm run build

      - name: Electron main bundle
        run: bash electron/build.sh

      - name: Build Rust agent binary
        run: cargo build --release --target ${{ matrix.rust-target }} -p xai-grok-pager-bin -p ptyctl-cli

      # extraResources expects the binaries at target/release — normalize the
      # cross-arch target dir into that path.
      - name: Stage agent binary
        shell: bash
        run: |
          mkdir -p target/release
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "target/${{ matrix.rust-target }}/release/xai-grok-pager.exe" target/release/xai-grok-pager.exe
            cp "target/${{ matrix.rust-target }}/release/ptyctl.exe" target/release/ptyctl.exe
          else
            cp "target/${{ matrix.rust-target }}/release/xai-grok-pager" target/release/xai-grok-pager
            cp "target/${{ matrix.rust-target }}/release/ptyctl" target/release/ptyctl
          fi

      # Pack gate: refuse to build an installer whose embedded agent binary is
      # missing or truncated (empty-shell guard, ISS-071 negative criterion).
      - name: Pack gate — agent binary present
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            node scripts/check-agent-bin.mjs target/release/xai-grok-pager.exe
            node scripts/check-agent-bin.mjs target/release/ptyctl.exe
          else
            node scripts/check-agent-bin.mjs target/release/xai-grok-pager
            node scripts/check-agent-bin.mjs target/release/ptyctl
          fi

      - name: Package with electron-builder
        shell: bash
        # electron-builder 26 has no --arch flag — arch is a CLI switch
        # (--arm64 / --x64); the platform defaults to the build host.
        run: npx electron-builder --publish never ${{ matrix.arch == 'arm64' && '--arm64' || '--x64' }}
        env:
          # Unsigned smoke artifacts (PR/manual). Signed+notarized release
          # artifacts come from the tag-only release-mac job below (R5-08).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Feed gate (R5-07 / #263): every update manifest must reference files
      # that exist on disk with matching size/sha512 BEFORE anything is
      # uploaded. A drifting feed (manifest names ≠ artifact names) fails the
      # job here instead of 404ing in electron-updater later.
      - name: Verify update feed consistency
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(release/latest*.yml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::no update manifest (latest*.yml) generated in release/"
            exit 1
          fi
          for m in "${manifests[@]}"; do
            echo "::group::verify $m"
            node scripts/verify-update-feed.mjs "$m" release
            echo "::endgroup::"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Smoke channel is explicitly marked unsigned — never confusable
          # with a signed release artifact (R5-08).
          name: grok-build-unsigned-smoke-${{ matrix.rust-target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest*.yml
          if-no-files-found: error

  # R5-08 (#264): signed + notarized macOS release artifacts. Runs ONLY on
  # version tags and ONLY inside the protected `release` environment (its
  # approval rules gate access to the signing secrets).
  release-mac:
    name: Release macOS (${{ matrix.arch }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust-target: aarch64-apple-darwin
            arch: arm64
            label: macOS ARM
          - rust-target: x86_64-apple-darwin
            arch: x64
            label: macOS Intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export PROTOC for build scripts
        shell: bash
        run: |
          P="$(command -v protoc)"
          if command -v cygpath >/dev/null 2>&1; then P="$(cygpath -w "$P")"; fi
          echo "PROTOC=$P" >> "$GITHUB_ENV"

      - name: Ensure cross-compile target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.rust-target }}

      # A tag release must NEVER silently degrade to unsigned (R5-08):
      # missing signing credentials fail the build before anything is packed.
      # Only presence/absence booleans are echoed — never secret material.
      - name: Preflight — signing credentials present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing required signing secret: $v"
              missing=1
            else
              echo "secret present: $v"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::tag release requires all signing secrets in the protected 'release' environment"
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Preflight — toolchain contract (node, lockfile, protoc, rust)
        # R6-02 (#280): reject unsupported runtimes before expensive builds.
        shell: bash
        run: node scripts/check-toolchain.mjs --require protoc,rust

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Typecheck + frontend build
        run: npm run build

      - name: Electron main bundle
        run: bash electron/build.sh

      - name: Build Rust agent binary
        run: cargo build --release --target ${{ matrix.rust-target }} -p xai-grok-pager-bin -p ptyctl-cli

      - name: Stage agent binary
        shell: bash
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.rust-target }}/release/xai-grok-pager" target/release/xai-grok-pager
          cp "target/${{ matrix.rust-target }}/release/ptyctl" target/release/ptyctl

      - name: Pack gate — agent binary present
        shell: bash
        run: |
          node scripts/check-agent-bin.mjs target/release/xai-grok-pager
          node scripts/check-agent-bin.mjs target/release/ptyctl

      - name: Package signed + notarized with electron-builder
        shell: bash
        run: npx electron-builder --publish never -c.mac.notarize=true ${{ matrix.arch == 'arm64' && '--arm64' || '--x64' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS release (codesign + Gatekeeper + stapler)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in release/*.dmg; do
            echo "::group::verify $d"
            bash scripts/verify-macos-release.sh "$d"
            echo "::endgroup::"
          done

      - name: Verify update feed consistency
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for m in release/latest*.yml; do
            node scripts/verify-update-feed.mjs "$m" release
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-release-${{ matrix.rust-target }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: error

  # R5-10 / #266: the single auditable release gate. Runs `npm run release:gate`
  # (unit → build → electron-build → evidence → agent-bins → pack → e2e →
  # checksums → feed-verify → uat → host-platform install smoke →
  # user-data-unchanged) on each platform so the platform-gated smoke steps
  # (macos/linux/windows) all execute in CI. `if: always()` on the upload surfaces the failure summary even when
  # the gate fails. The macOS leg uses the `release` environment for Apple
  # notarization secrets; linux/win32 legs run without it (secrets are mac-only).
  release-gate:
    name: R5 Release Gate (${{ matrix.label }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            label: macOS ARM
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            label: Windows x64
          - platform: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            label: Linux x64
    runs-on: ${{ matrix.platform }}
    # Apple notarization secrets live in the `release` environment; only the
    # macOS leg needs it. The expression yields '' for non-mac legs, which
    # GitHub treats as no environment (no deployment record / junk env).
    environment: ${{ matrix.platform == 'macos-latest' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export PROTOC for build scripts
        shell: bash
        run: |
          P="$(command -v protoc)"
          # git-bash reports /c/... paths; Win32 CreateProcess needs C:\...
          if command -v cygpath >/dev/null 2>&1; then P="$(cygpath -w "$P")"; fi
          echo "PROTOC=$P" >> "$GITHUB_ENV"

      - name: Preflight — toolchain contract (node, lockfile, protoc, rust)
        shell: bash
        run: node scripts/check-toolchain.mjs --require protoc,rust

      - name: Install dependencies
        run: npm ci

      # electron-builder's extraResources pull target/release/xai-grok-pager +
      # ptyctl; a fresh CI checkout has neither, so the gate's pack step would
      # fail with "file source doesn't exist". Build + stage them first (mirrors
      # the package job).
      - name: Build Rust agent binary
        run: cargo build --release --target ${{ matrix.rust-target }} -p xai-grok-pager-bin -p ptyctl-cli

      - name: Stage agent binary
        shell: bash
        run: |
          mkdir -p target/release
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp "target/${{ matrix.rust-target }}/release/xai-grok-pager.exe" target/release/xai-grok-pager.exe
            cp "target/${{ matrix.rust-target }}/release/ptyctl.exe" target/release/ptyctl.exe
          else
            cp "target/${{ matrix.rust-target }}/release/xai-grok-pager" target/release/xai-grok-pager
            cp "target/${{ matrix.rust-target }}/release/ptyctl" target/release/ptyctl
          fi

      # The ubuntu leg's linux-smoke step launches the packaged AppImage, which
      # needs a display; verify-linux-release.sh starts its OWN dedicated Xvfb
      # when DISPLAY is absent (CI has none). e2e itself is darwin-only
      # (Playwright snapshot baselines, #261).
      - name: Install Xvfb (linux only)
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run release gate (single auditable command)
        run: npm run release:gate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ matrix.label }}
          path: |
            release/release-report.json
            release/release-report.md
          if-no-files-found: warn
