[package]
license = "Apache-2.0"
name = "xai-grok-evolution"
version = "0.1.0"
edition.workspace = true

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
libc = { workspace = true }
oris-evolution = { workspace = true }
oris-kernel = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
xai-circuit-breaker = { workspace = true }
xai-grok-sandbox = { path = "../xai-grok-sandbox" }
xai-sqlite-journal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[example]]
name = "e2e_pipeline"
required-features = ["test-support"]

[[bin]]
name = "xai-grok-evolution-worker"
path = "src/bin/evolution-worker.rs"

[lints]
workspace = true
