name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Test + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

      - name: Typecheck + frontend build
        run: npm run build

      - name: Electron main bundle
        run: bash electron/build.sh

      # Evidence chain: record the SHA and test summary for acceptance checks
      - name: Generate evidence snapshot
        if: always()
        run: |
          mkdir -p evidence
          echo "sha=$(git rev-parse HEAD)" >> evidence/summary.txt
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> evidence/summary.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/summary.txt
          echo "tests=$(cat test-results/junit.xml 2>/dev/null | grep -c '<testcase ' || echo 'unknown')" >> evidence/summary.txt
          cat evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence/
          retention-days: 7

  rust-pty:
    # R5-09 (#265): the PTY controller must reap its child process group on
    # shutdown. The behavior differs per platform (process groups + hangup on
    # unix, ConPTY on Windows), so the suite runs on both unix CI platforms.
    name: Rust PTY controller (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: pty-${{ matrix.os }}

      - name: Cargo test (ptyctl crates)
        run: cargo test -p ptyctl -p ptyctl-cli

      - name: Build ptyctl (release)
        run: cargo build --release -p ptyctl-cli

      - name: Install frontend dependencies
        run: npm ci

      - name: PTY manager integration tests (Vitest)
        run: npx vitest run electron/__tests__/pty-manager.test.ts
        env:
          GROK_PTYCTL_BIN: ${{ github.workspace }}/target/release/ptyctl

  e2e:
    # R5-05 (#261): Electron Playwright visual + keyboard regression against
    # the packed app. macOS matches the primary dev platform; the fixture
    # isolates every run from the real user profile.
    name: Electron E2E (Playwright)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 25.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: e2e-macos

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Rust agent binary
        run: cargo build --release -p xai-grok-pager-bin -p ptyctl-cli

      # Clean prior pack output so a cancelled/partial run cannot be reused as
      # success on rerun (R6-01 #279): the fixture resolves release/*, so a
      # stale partial package there would be picked up as if it built.
      - name: Clean prior pack/e2e output
        run: rm -rf release e2e-results

      # electron:pack now passes --publish never (R6-01 #279), so
      # electron-builder never requests GH_TOKEN and never publishes even when
      # the runner's default token is present. CSC_IDENTITY_AUTO_DISCOVERY
      # stays false so no signing identity is required.
      - name: Pack (unsigned, non-publishing, for e2e)
        run: npm run electron:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Run Electron e2e suite
        run: npm run test:e2e
        env:
          # Pin the visual environment so snapshots reproduce in CI.
          TZ: Asia/Shanghai
          LANG: zh-CN.UTF-8

      # A skipped/empty Playwright invocation must fail the job — the original
      # R6-01 regression had the pack step halt so Playwright never ran. The
      # guard reads the JSON report and fails when 0 tests executed (R6-01 #279).
      - name: Assert Playwright actually ran tests
        if: always()
        run: node scripts/assert-e2e-ran.mjs

      # Exact-SHA evidence binding for the e2e job (R6-01 #279).
      - name: Generate e2e evidence snapshot
        if: always()
        run: |
          mkdir -p evidence
          echo "sha=$(git rev-parse HEAD)" >> evidence/e2e-summary.txt
          echo "job=e2e" >> evidence/e2e-summary.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/e2e-summary.txt
          cat evidence/e2e-summary.txt

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results/
            evidence/e2e-summary.txt
          retention-days: 7
