name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Test + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Preflight — toolchain contract
        # R6-02 (#280): reject unsupported runtimes before expensive builds.
        # Default requires node + lockfile; this job doesn't need protoc/rust.
        shell: bash
        run: npm run check:toolchain

      - name: Dependency audit gate (critical/high owned)
        # R6-03 (#281): every critical/high npm-audit finding must be fixed or
        # listed in security/audit-exceptions.json with owner + mitigation +
        # non-expired expiry. Unowned or invalid/expired exceptions fail the job.
        # Reads package-lock.json (no node_modules needed) — fails fast on
        # security regressions before the expensive install.
        shell: bash
        run: npm run check:deps-audit

      - name: Install dependencies (locked)
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

      - name: Typecheck + frontend build
        run: npm run build

      - name: Electron main bundle
        run: bash electron/build.sh

      # Evidence chain: record the SHA and test summary for acceptance checks
      - name: Generate evidence snapshot
        if: always()
        run: |
          mkdir -p evidence
          echo "sha=$(git rev-parse HEAD)" >> evidence/summary.txt
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> evidence/summary.txt
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/summary.txt
          echo "tests=$(cat test-results/junit.xml 2>/dev/null | grep -c '<testcase ' || echo 'unknown')" >> evidence/summary.txt
          node scripts/check-toolchain.mjs --json > evidence/toolchain.json 2>/dev/null || true
          cat evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence/
          retention-days: 7

  rust-pty:
    # R5-09 (#265): the PTY controller must reap its child process group on
    # shutdown. The behavior differs per platform (process groups + hangup on
    # unix, ConPTY on Windows), so the suite runs on both unix CI platforms.
    name: Rust PTY controller (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight — toolchain contract (node, lockfile, rust)
        # rust-toolchain.toml is authoritative (cargo honors it); this verifies
        # the effective rustc matches the pin. protoc isn't needed here.
        shell: bash
        run: node scripts/check-toolchain.mjs --require rust

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: pty-${{ matrix.os }}

      - name: Cargo test (ptyctl crates)
        run: cargo test -p ptyctl -p ptyctl-cli

      - name: Build ptyctl (release)
        run: cargo build --release -p ptyctl-cli

      - name: Install frontend dependencies
        run: npm ci

      - name: PTY manager integration tests (Vitest)
        run: npx vitest run electron/__tests__/pty-manager.test.ts
        env:
          GROK_PTYCTL_BIN: ${{ github.workspace }}/target/release/ptyctl

  e2e:
    # R5-05 (#261): Electron Playwright visual + keyboard regression against
    # the packed app. macOS matches the primary dev platform; the fixture
    # isolates every run from the real user profile.
    name: Electron E2E (Playwright)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 29.3
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — toolchain contract (node, lockfile, protoc, rust)
        # This job needs protoc + rust; a missing protoc or drifted rustc fails.
        shell: bash
        run: node scripts/check-toolchain.mjs --require protoc,rust

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: e2e-macos

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Rust agent binary
        run: cargo build --release -p xai-grok-pager-bin -p ptyctl-cli

      - name: Pack (unsigned, for e2e)
        run: npm run electron:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Run Electron e2e suite
        run: npm run test:e2e
        env:
          # Pin the visual environment so snapshots reproduce in CI.
          TZ: Asia/Shanghai
          LANG: zh-CN.UTF-8

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/
          retention-days: 7
